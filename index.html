<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIKE Support</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #33206f 0, #090b14 52%, #04050a 100%);
      color: #f7f7fb;
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", sans-serif;
    }
    main {
      width: min(100%, 620px);
      padding: 42px 30px;
      border: 1px solid #8b5cf6;
      border-radius: 28px;
      background: rgba(12, 12, 25, .9);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .45);
      text-align: center;
    }
    .mark {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 22px;
      background: linear-gradient(145deg, #a334f4, #38158f);
      font-size: 42px;
      font-weight: 900;
    }
    h1 { margin: 0 0 14px; font-size: clamp(32px, 8vw, 48px); }
    p {
      margin: 0 auto 28px;
      max-width: 460px;
      color: #c9c8d5;
      font-size: 18px;
      line-height: 1.55;
    }
    a {
      display: inline-block;
      padding: 15px 24px;
      border-radius: 999px;
      background: #56d9e8;
      color: #071017;
      font-weight: 800;
      text-decoration: none;
    }
    small { display: block; margin-top: 26px; color: #85869a; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <h1>SIKE Support</h1>
    <p>Need help with SIKE, COSMO, notifications, your membership, or your account? Send us an email and we will help you.</p>
    <a href="mailto:aucenciom.am@gmail.com?subject=SIKE%20Support">Email SIKE Support</a>
    <small>SIKE: I Got You</small>
  </main>
</body>
</html>
